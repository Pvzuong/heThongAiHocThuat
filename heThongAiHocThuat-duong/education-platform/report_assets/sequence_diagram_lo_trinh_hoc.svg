<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #111827; }
      .head { fill: #eef2ff; stroke: #111827; stroke-width: 2; }
      .headText { font: 700 18px Arial, sans-serif; fill: #111827; }
      .life { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 8; }
      .act { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .msg { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #222; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#openArrow); }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .frame { fill: none; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; }
      .frameTitle { font: 700 16px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1250" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" class="title">Sequence Diagram - Lộ trình học cá nhân</text>

  <rect x="65" y="95" width="170" height="58" rx="8" class="head"/>
  <text x="150" y="130" text-anchor="middle" class="headText">Student</text>

  <rect x="340" y="95" width="210" height="58" rx="8" class="head"/>
  <text x="445" y="120" text-anchor="middle" class="headText">UI</text>
  <text x="445" y="142" text-anchor="middle" class="small">Path/Placement Page</text>

  <rect x="665" y="95" width="230" height="58" rx="8" class="head"/>
  <text x="780" y="120" text-anchor="middle" class="headText">API Controller</text>
  <text x="780" y="142" text-anchor="middle" class="small">/api/paths</text>

  <rect x="1010" y="95" width="220" height="58" rx="8" class="head"/>
  <text x="1120" y="120" text-anchor="middle" class="headText">Path Service</text>
  <text x="1120" y="142" text-anchor="middle" class="small">Business logic</text>

  <rect x="1370" y="95" width="170" height="58" rx="8" class="head"/>
  <text x="1455" y="130" text-anchor="middle" class="headText">Database</text>

  <line x1="150" y1="153" x2="150" y2="1190" class="life"/>
  <line x1="445" y1="153" x2="445" y2="1190" class="life"/>
  <line x1="780" y1="153" x2="780" y2="1190" class="life"/>
  <line x1="1120" y1="153" x2="1120" y2="1190" class="life"/>
  <line x1="1455" y1="153" x2="1455" y2="1190" class="life"/>

  <rect x="436" y="205" width="18" height="925" class="act"/>
  <rect x="771" y="265" width="18" height="805" class="act"/>
  <rect x="1111" y="315" width="18" height="700" class="act"/>
  <rect x="1446" y="350" width="18" height="565" class="act"/>

  <line x1="150" y1="225" x2="436" y2="225" class="msg"/>
  <text x="293" y="213" text-anchor="middle" class="text">1. Chọn lộ trình học</text>

  <line x1="454" y1="285" x2="771" y2="285" class="msg"/>
  <text x="612" y="273" text-anchor="middle" class="text">2. GET /api/paths/:pathSlug</text>

  <line x1="789" y1="335" x2="1111" y2="335" class="msg"/>
  <text x="950" y="323" text-anchor="middle" class="text">3. getPathDetail(pathSlug, userId)</text>

  <line x1="1129" y1="375" x2="1446" y2="375" class="msg"/>
  <text x="1287" y="363" text-anchor="middle" class="text">4. Lấy lộ trình, module, bài học</text>

  <line x1="1446" y1="425" x2="1129" y2="425" class="ret"/>
  <text x="1287" y="413" text-anchor="middle" class="text">5. Trả dữ liệu lộ trình</text>

  <line x1="1129" y1="475" x2="1446" y2="475" class="msg"/>
  <text x="1287" y="463" text-anchor="middle" class="text">6. Kiểm tra progress/result</text>

  <line x1="1446" y1="525" x2="1129" y2="525" class="ret"/>
  <text x="1287" y="513" text-anchor="middle" class="text">7. Trả trạng thái học tập</text>

  <line x1="1111" y1="575" x2="789" y2="575" class="ret"/>
  <text x="950" y="563" text-anchor="middle" class="text">8. Thông tin lộ trình</text>

  <line x1="771" y1="625" x2="454" y2="625" class="ret"/>
  <text x="612" y="613" text-anchor="middle" class="text">9. Response path detail</text>

  <line x1="436" y1="675" x2="150" y2="675" class="ret"/>
  <text x="293" y="663" text-anchor="middle" class="text">10. Hiển thị lộ trình</text>

  <rect x="95" y="715" width="1430" height="345" class="frame"/>
  <rect x="95" y="715" width="330" height="34" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="260" y="738" text-anchor="middle" class="frameTitle">alt Chưa có kết quả kiểm tra đầu vào</text>

  <line x1="150" y1="785" x2="436" y2="785" class="msg"/>
  <text x="293" y="773" text-anchor="middle" class="text">11. Bắt đầu kiểm tra đầu vào</text>

  <line x1="454" y1="825" x2="771" y2="825" class="msg"/>
  <text x="612" y="813" text-anchor="middle" class="text">12. GET placement-test</text>

  <line x1="789" y1="865" x2="1111" y2="865" class="msg"/>
  <text x="950" y="853" text-anchor="middle" class="text">13. getPlacementTest(pathSlug)</text>

  <line x1="1129" y1="905" x2="1446" y2="905" class="msg"/>
  <text x="1287" y="893" text-anchor="middle" class="text">14. Lấy placement_tests/questions</text>

  <line x1="1446" y1="945" x2="454" y2="945" class="ret"/>
  <text x="950" y="933" text-anchor="middle" class="text">15. Trả danh sách câu hỏi về UI</text>

  <line x1="436" y1="985" x2="150" y2="985" class="ret"/>
  <text x="293" y="973" text-anchor="middle" class="text">16. Hiển thị bài kiểm tra</text>

  <line x1="150" y1="1030" x2="436" y2="1030" class="msg"/>
  <text x="293" y="1018" text-anchor="middle" class="text">17. Nộp câu trả lời</text>

  <line x1="454" y1="1085" x2="771" y2="1085" class="msg"/>
  <text x="612" y="1073" text-anchor="middle" class="text">18. POST /placement-test/:testId/submit</text>

  <line x1="789" y1="1125" x2="1111" y2="1125" class="msg"/>
  <text x="950" y="1113" text-anchor="middle" class="text">19. Chấm điểm và xác định module bắt đầu</text>

  <line x1="1129" y1="1165" x2="1446" y2="1165" class="msg"/>
  <text x="1287" y="1153" text-anchor="middle" class="text">20. Lưu placement_results, skill_path_progress</text>

  <line x1="1446" y1="1200" x2="454" y2="1200" class="ret"/>
  <text x="950" y="1188" text-anchor="middle" class="text">21. Trả điểm, đánh giá và lộ trình cá nhân</text>
</svg>
