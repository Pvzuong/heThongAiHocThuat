<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .laneTitle { font: 700 22px Arial, sans-serif; fill: #111827; }
      .text { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 16px Arial, sans-serif; fill: #374151; }
      .node { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .decision { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .line { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .plainLine { stroke: #222; stroke-width: 2.2; fill: none; }
      .label { font: 16px Arial, sans-serif; fill: #111827; font-style: italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1650" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">Activity Diagram - Lộ trình học cá nhân</text>

  <rect x="60" y="90" width="520" height="1510" class="lane"/>
  <rect x="580" y="90" width="560" height="1510" class="lane"/>
  <line x1="580" y1="90" x2="580" y2="1600" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="130" text-anchor="middle" class="laneTitle">Student</text>
  <text x="860" y="130" text-anchor="middle" class="laneTitle">Hệ thống LearnHub</text>

  <circle cx="320" cy="190" r="17" fill="#111827"/>
  <text x="320" y="235" text-anchor="middle" class="small">Bắt đầu</text>

  <rect x="170" y="280" width="300" height="66" rx="22" class="node"/>
  <text x="320" y="306" text-anchor="middle" class="text">Đăng nhập vào</text>
  <text x="320" y="330" text-anchor="middle" class="text">hệ thống</text>

  <rect x="700" y="390" width="320" height="66" rx="22" class="node"/>
  <text x="860" y="417" text-anchor="middle" class="text">Xác thực tài khoản</text>
  <text x="860" y="441" text-anchor="middle" class="text">và quyền truy cập</text>

  <rect x="170" y="500" width="300" height="66" rx="22" class="node"/>
  <text x="320" y="527" text-anchor="middle" class="text">Chọn lộ trình học</text>
  <text x="320" y="551" text-anchor="middle" class="text">muốn bắt đầu</text>

  <rect x="700" y="610" width="320" height="72" rx="22" class="node"/>
  <text x="860" y="638" text-anchor="middle" class="text">Kiểm tra kết quả</text>
  <text x="860" y="662" text-anchor="middle" class="text">kiểm tra đầu vào</text>

  <polygon points="860,745 1010,835 860,925 710,835" class="decision"/>
  <text x="860" y="812" text-anchor="middle" class="text">Đã có kết quả</text>
  <text x="860" y="837" text-anchor="middle" class="text">kiểm tra đầu vào?</text>

  <rect x="170" y="970" width="300" height="74" rx="22" class="node"/>
  <text x="320" y="998" text-anchor="middle" class="text">Làm bài kiểm tra</text>
  <text x="320" y="1022" text-anchor="middle" class="text">đầu vào</text>

  <rect x="170" y="1090" width="300" height="66" rx="22" class="node"/>
  <text x="320" y="1130" text-anchor="middle" class="text">Nộp bài kiểm tra</text>

  <rect x="700" y="970" width="320" height="66" rx="22" class="node"/>
  <text x="860" y="997" text-anchor="middle" class="text">Chấm điểm và</text>
  <text x="860" y="1021" text-anchor="middle" class="text">đánh giá năng lực</text>

  <rect x="700" y="1090" width="320" height="66" rx="22" class="node"/>
  <text x="860" y="1117" text-anchor="middle" class="text">Lưu kết quả</text>
  <text x="860" y="1141" text-anchor="middle" class="text">đánh giá</text>

  <rect x="700" y="1210" width="320" height="72" rx="22" class="node"/>
  <text x="860" y="1238" text-anchor="middle" class="text">Đề xuất module</text>
  <text x="860" y="1262" text-anchor="middle" class="text">bắt đầu phù hợp</text>

  <rect x="700" y="1330" width="320" height="72" rx="22" class="node"/>
  <text x="860" y="1358" text-anchor="middle" class="text">Tạo hoặc cập nhật</text>
  <text x="860" y="1382" text-anchor="middle" class="text">tiến độ lộ trình</text>

  <rect x="170" y="1450" width="300" height="66" rx="22" class="node"/>
  <text x="320" y="1477" text-anchor="middle" class="text">Xem lộ trình học</text>
  <text x="320" y="1501" text-anchor="middle" class="text">cá nhân</text>

  <circle cx="320" cy="1565" r="22" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="320" cy="1565" r="13" fill="#111827"/>
  <text x="320" y="1610" text-anchor="middle" class="small">Kết thúc</text>

  <line x1="320" y1="207" x2="320" y2="280" class="line"/>
  <path d="M320 346 L320 370 L860 370 L860 390" class="line"/>
  <path d="M860 456 L860 480 L320 480 L320 500" class="line"/>
  <path d="M320 566 L320 590 L860 590 L860 610" class="line"/>
  <line x1="860" y1="682" x2="860" y2="745" class="line"/>

  <path d="M710 835 L320 835 L320 970" class="line"/>
  <text x="510" y="812" text-anchor="middle" class="label">Chưa có</text>
  <line x1="320" y1="1044" x2="320" y2="1090" class="line"/>
  <path d="M470 1123 L660 1123 L660 1003 L700 1003" class="line"/>
  <line x1="860" y1="1036" x2="860" y2="1090" class="line"/>
  <line x1="860" y1="1156" x2="860" y2="1210" class="line"/>
  <line x1="860" y1="1282" x2="860" y2="1330" class="line"/>

  <path d="M1010 835 L1080 835 L1080 1366 L1020 1366" class="line"/>
  <text x="1053" y="812" text-anchor="middle" class="label">Đã có</text>

  <path d="M700 1366 L520 1366 L520 1483 L470 1483" class="line"/>
  <line x1="320" y1="1516" x2="320" y2="1543" class="line"/>
</svg>
